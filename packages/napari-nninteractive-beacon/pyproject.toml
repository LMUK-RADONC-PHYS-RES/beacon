[project]
name = "napari-nninteractive-beacon"
version = "0.1.0"
description = "BEACON extensions for the classic nnInteractive Napari widget"
requires-python = ">=3.12,<3.14"
dependencies = [
    "napari-nninteractive[local]==2.5.3",
    "napari-beacon-layers",
    "numpy",
    "qtpy",
]

[project.entry-points."napari.manifest"]
napari-nninteractive-beacon = "napari_nninteractive_beacon:napari.yaml"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
