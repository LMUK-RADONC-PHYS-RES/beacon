[project]
name = "napari-segmentation-metrics"
version = "0.1.0"
description = "Interactive geometric metrics for Napari segmentation layers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Framework :: napari",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "napari>=0.6",
    "numpy",
    "qtpy",
    "scipy>=1.10",
    "surface-distance>=0.1",
]

[project.entry-points."napari.manifest"]
napari-segmentation-metrics = "napari_segmentation_metrics:napari.yaml"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "napari_segmentation_metrics"
module-root = "src"